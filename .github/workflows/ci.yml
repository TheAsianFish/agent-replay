name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy agent_replay examples eval
      - name: Test
        run: uv run pytest -q
      - name: Quickstart (replay passes, mutant fails)
        run: make demo
      - name: replay ci on the retail suite (every mode passes, every mutant fails)
        run: make ci-demo
      - name: replay flake offline (fake model passes, seeded flaky model fails the gate)
        run: make flake-demo
      - name: Mutation study and gate simulation reproduce their committed results
        run: |
          make eval-mutations
          make bench-sprt
          git diff --exit-code eval/results/mutations.json eval/results/sprt_sim.json

  postgres:
    name: Store and API on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: replay
          POSTGRES_PASSWORD: replay
          POSTGRES_DB: replay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U replay -d replay_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      REPLAY_TEST_PG_URL: postgresql+psycopg://replay:replay@localhost:5432/replay_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Migration, store and API tests on PostgreSQL 16
        run: uv run pytest -q -m postgres

  dashboard:
    name: Dashboard (types, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types match openapi.json
        run: npm run check:types
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  package:
    name: Wheel builds and installs in a clean venv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the dashboard into the package
        run: make ui
      - name: Build the wheel and sdist
        run: uv build
      - name: Install each in a fresh venv and smoke-test it
        run: scripts/check_wheel.sh --expect-dashboard dist
      - name: Metadata renders on PyPI
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: Dashboard smoke test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: |
          uv sync --locked --all-extras
          npm ci --prefix dashboard --no-audit --no-fund
          (cd dashboard && npx playwright install --with-deps chromium)
      - name: Build the dashboard and seed the demo store
        run: |
          npm run build --prefix dashboard
          make demo-data
      - name: Serve it and run the smoke test
        run: |
          uv run replay serve --db sqlite:///.replay/demo.db --port 8000 &
          server=$!
          # Stop the server when the step ends: left running, it holds uv's
          # cache lock and the setup-uv post step times out on it.
          trap 'rc=$?; kill $server 2>/dev/null; wait $server 2>/dev/null || true; exit $rc' EXIT
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8000/api/health; do sleep 1; done'
          npm run e2e --prefix dashboard
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: dashboard/test-results
          retention-days: 7

  compose:
    name: docker compose up serves the demo data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build --detach --wait app
      - name: The API serves the seeded runs and the dashboard
        run: |
          total=$(curl -sf 'http://localhost:8000/api/runs?limit=1' | jq .total)
          echo "runs served: $total"
          test "$total" -gt 0
          curl -sf http://localhost:8000/api/health | jq -e '.backend == "postgresql"'
          curl -sf http://localhost:8000/ | grep -q '<div id="root">'
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -n 200
      - name: Stop
        if: always()
        run: docker compose down --volumes

  live:
    name: Live API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on manual runs and pushes to main, and only when the secret exists.
    if: github.event_name != 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        if: env.ANTHROPIC_API_KEY != ''
        run: uv sync --locked --all-extras
      - name: Live tests
        if: env.ANTHROPIC_API_KEY != ''
        run: uv run pytest -q -m live
      - name: Skip notice
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY secret not set; live tests skipped."
