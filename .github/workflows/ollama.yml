name: Local model (Ollama)

# The pydantic-ai example against qwen2.5:7b on the runner's CPU: re-record its live
# cassettes and/or run `make eval-pydantic-ai` (replay flake in model-live, 10 runs per
# scenario), or with `arms` the M12 strict and fallback arms (make eval-pydantic-ai-arms),
# or with `swap` the M15 model, prompt and temperature arms (make eval-pydantic-ai-swap),
# or with `long` the M16 rebooking chain under strict and fallback (make eval-pydantic-ai-long).
# Free (an open model, no key) but slow: started by hand only, never on a
# push or pull request. Results come back as an artifact to review and commit.
on:
  workflow_dispatch:
    inputs:
      record:
        description: "Re-record the qwen2.5:7b cassettes first (make record-pydantic-ai)"
        type: boolean
        default: false
      runs:
        description: "model-live runs per scenario"
        type: number
        default: 10
      arms:
        description: "Instead of the flake: strict and fallback arms, 20 runs each (make eval-pydantic-ai-arms)"
        type: boolean
        default: false
      swap:
        description: "Instead of the flake: the M15 swap arms on qwen2.5:3b and qwen2.5:7b (make eval-pydantic-ai-swap)"
        type: boolean
        default: false
      long:
        description: "Instead of the flake: the M16 rebooking chain, strict and fallback (make eval-pydantic-ai-long)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ollama:
    name: pydantic-ai travel desk on qwen2.5:7b
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OLLAMA_VERSION: v0.40.11
      MODEL: qwen2.5:7b
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --all-extras
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.MODEL }}${{ inputs.swap && '-qwen2.5-3b' || '' }}
      - name: Install and start Ollama
        run: |
          curl -fsSL -o /tmp/ollama.tar.zst \
            "https://github.com/ollama/ollama/releases/download/${OLLAMA_VERSION}/ollama-linux-amd64.tar.zst"
          mkdir -p /tmp/ollama && tar --use-compress-program=unzstd -xf /tmp/ollama.tar.zst -C /tmp/ollama
          OLLAMA_NUM_PARALLEL=1 nohup /tmp/ollama/bin/ollama serve > /tmp/ollama.log 2>&1 &
          for _ in $(seq 30); do curl -fs localhost:11434/api/version && break; sleep 1; done
          /tmp/ollama/bin/ollama pull "$MODEL"
          if [ "${{ inputs.swap }}" = "true" ]; then /tmp/ollama/bin/ollama pull qwen2.5:3b; fi
      - name: Re-record the live cassettes
        if: ${{ inputs.record }}
        run: make record-pydantic-ai
      - name: replay ci in full, then replay flake in model-live
        if: ${{ !inputs.arms && !inputs.swap && !inputs.long }}
        run: uv run python -m eval.pydantic_ai --runs ${{ inputs.runs }}
      - name: replay ci in full, then the strict and fallback arms in model-live
        if: ${{ inputs.arms && !inputs.long }}
        run: make eval-pydantic-ai-arms
      - name: replay ci in full, then the M15 swap arms in model-live
        if: ${{ inputs.swap && !inputs.arms && !inputs.long }}
        run: make eval-pydantic-ai-swap
      - name: replay ci in full, then the M16 rebooking chain in model-live
        if: ${{ inputs.long }}
        run: make eval-pydantic-ai-long
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pydantic-ai-qwen
          path: |
            eval/results/m9_*
            eval/results/m12_*
            eval/results/m15_*
            eval/results/m16_*
            examples/pydantic_ai_agent/cassettes/qwen/
            /tmp/ollama.log
