# The travel desk's regression suite over the fake-model recordings:
# `uv run replay ci examples/pydantic_ai_agent/replay.toml`.
# The agent is pydantic-ai; Replay records it through the Anthropic client it is
# given (client.beta.messages.create). The checks judge outcomes, not the exact
# path: `in_order` sequences allow extra lookups, and the rules check the writes
# and the figures in the answer, so a different model (replay-qwen.toml) that
# takes another reasonable route still passes. Paths are relative to this file.

[defaults]
agent = "examples.pydantic_ai_agent.agent:run"
mode = "full"
policy = "strict"
checks = [
  { type = "rule", ref = "examples.pydantic_ai_agent.rules:looked_up_before_writing" },
]


# The step limits are per scenario: 8 tool calls and 6 model calls for the short
# tasks, more for the rebooking chain, whose shortest path is 9 tool calls.

# The arguments that name what each tool reads or writes: a served call is only
# ever given a recording of the same entity (a booking of another flight is
# unrecorded, and the policy decides). Values compare exactly, so "sfo" is not
# "SFO".
[defaults.identify]
search_flights = ["origin", "destination", "date"]
convert_currency = ["amount", "from_currency", "to_currency"]
get_booking = ["booking_ref"]
book_flight = ["flight_id", "passenger"]
cancel_booking = ["booking_ref"]

[[scenario]]
name = "cheapest_fare_in_euros"
cassette = "cassettes/cheapest_fare_in_euros.jsonl"
checks = [
  { type = "max_tool_calls", limit = 8 },
  { type = "budget", max_model_calls = 6 },
  { type = "tool_sequence", expected = ["search_flights", "convert_currency"], mode = "in_order" },
  { type = "forbidden_tools", tools = ["book_flight", "cancel_booking"] },
  { type = "rule", ref = "examples.pydantic_ai_agent.rules:answer_states", args = { task = "cheapest_fare_in_euros" } },
]

[[scenario]]
name = "book_earliest_flight"
cassette = "cassettes/book_earliest_flight.jsonl"
checks = [
  { type = "max_tool_calls", limit = 8 },
  { type = "budget", max_model_calls = 6 },
  { type = "tool_sequence", expected = ["search_flights", "book_flight"], mode = "in_order" },
  { type = "rule", ref = "examples.pydantic_ai_agent.rules:writes_match", args = { task = "book_earliest_flight" } },
  { type = "rule", ref = "examples.pydantic_ai_agent.rules:answer_states", args = { task = "book_earliest_flight" } },
]

[[scenario]]
name = "cancel_refundable_booking"
cassette = "cassettes/cancel_refundable_booking.jsonl"
checks = [
  { type = "max_tool_calls", limit = 8 },
  { type = "budget", max_model_calls = 6 },
  { type = "tool_sequence", expected = ["get_booking", "cancel_booking"], mode = "in_order" },
  { type = "forbidden_tools", tools = ["book_flight"] },
  { type = "rule", ref = "examples.pydantic_ai_agent.rules:writes_match", args = { task = "cancel_refundable_booking" } },
  { type = "rule", ref = "examples.pydantic_ai_agent.rules:answer_states", args = { task = "cancel_refundable_booking" } },
]

# Eight get_booking calls, each on the reference the previous result named, then
# one conversion of the total: the shortest path is 9 tool calls in 10 model turns,
# so the limits leave room for a retry or two and no more.
[[scenario]]
name = "trace_rebooking_chain"
cassette = "cassettes/trace_rebooking_chain.jsonl"
checks = [
  { type = "max_tool_calls", limit = 12 },
  { type = "budget", max_model_calls = 14 },
  { type = "tool_sequence", expected = ["get_booking", "get_booking", "get_booking", "get_booking", "get_booking", "get_booking", "get_booking", "get_booking", "convert_currency"], mode = "in_order" },
  { type = "forbidden_tools", tools = ["book_flight", "cancel_booking"] },
  { type = "rule", ref = "examples.pydantic_ai_agent.rules:answer_states", args = { task = "trace_rebooking_chain" } },
]
