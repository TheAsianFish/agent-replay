# The retail suite over the six live claude-opus-5-5 recordings, gated on cost and
# latency against their baseline: `uv run replay ci examples/retail_agent/replay-live.toml`.
# Re-measure the baseline after an intended change with
# `uv run replay baseline examples/retail_agent/replay-live.toml -o examples/retail_agent/baseline-live.json`.
# In full mode served steps carry their recorded cost and latency, so the budget
# bites when a cassette is re-recorded or a scenario runs model-live. Paths are
# relative to this file. Every scenario runs the [defaults] checks, then its own.

[defaults]
agent = "examples.retail_agent.agent:run"
mode = "full"
policy = "strict"
# Medians per scenario from `replay baseline` (see the command above).
baseline = "baseline-live.json"
checks = [
  # The same tools, in the same order, as the recording.
  { type = "tool_sequence" },
  # Authenticate the user and fetch every order before changing it.
  { type = "rule", ref = "examples.retail_agent.rules:checked_before_writing" },
  # A runaway loop is a regression even if the answer comes out right.
  { type = "max_tool_calls", limit = 12 },
  { type = "budget", max_model_calls = 8 },
  # Relative to the baseline: at most 25% dearer or longer, 50% slower at p95.
  { type = "budget", max_cost_increase_pct = 25, max_tokens_increase_pct = 25, max_p95_latency_increase_pct = 50 },
  # claude-opus-5-5 grades each run against the rubric. Advisory: there is no
  # calibration report yet, so a failed criterion is reported, never gating.
  # Verdicts are cached in judge-cache/ (committed), so a full replay is judged
  # offline; set REPLAY_JUDGE_OFFLINE=1 to make a cache miss fail fast.
  { type = "judge", rubric = "rubric.yaml", cache_dir = "judge-cache" },
]

[[scenario]]
name = "cancel_pending_laptop"
cassette = "cassettes/live/cancel_pending_laptop.jsonl"
checks = [
  { type = "rule", ref = "examples.retail_agent.rules:matches_ground_truth", args = { task = "cancel_pending_laptop" } },
  { type = "arg_schema", tool = "cancel_pending_order", must_call = true, schema = { type = "object", required = ["order_id", "reason"], properties = { order_id = { type = "string", pattern = "^#W[0-9]{7}$" }, reason = { enum = ["no longer needed", "ordered by mistake"] } } } },
]

[[scenario]]
name = "modify_address_suite"
cassette = "cassettes/live/modify_address_suite.jsonl"
checks = [
  { type = "rule", ref = "examples.retail_agent.rules:matches_ground_truth", args = { task = "modify_address_suite" } },
  { type = "required_tools", tools = ["get_order_details", "modify_pending_order_address"] },
]

[[scenario]]
name = "return_damaged_bicycle"
cassette = "cassettes/live/return_damaged_bicycle.jsonl"
checks = [
  { type = "rule", ref = "examples.retail_agent.rules:matches_ground_truth", args = { task = "return_damaged_bicycle" } },
  { type = "arg_schema", tool = "return_delivered_order_items", must_call = true, schema = { type = "object", required = ["item_ids", "payment_method_id"], properties = { item_ids = { type = "array", minItems = 1 } } } },
]

[[scenario]]
name = "exchange_waterproof_boots"
cassette = "cassettes/live/exchange_waterproof_boots.jsonl"
checks = [
  { type = "rule", ref = "examples.retail_agent.rules:matches_ground_truth", args = { task = "exchange_waterproof_boots" } },
  { type = "required_tools", tools = ["get_product_details", "exchange_delivered_order_items"] },
]

[[scenario]]
name = "lookup_latest_order_total"
cassette = "cassettes/live/lookup_latest_order_total.jsonl"
checks = [
  { type = "rule", ref = "examples.retail_agent.rules:matches_ground_truth", args = { task = "lookup_latest_order_total" } },
  { type = "forbidden_tools", tools = ["cancel_pending_order", "modify_pending_order_address", "return_delivered_order_items", "exchange_delivered_order_items"] },
  { type = "output_schema", schema = { type = "string", pattern = "\\$829\\.43" } },
]

[[scenario]]
name = "transfer_swapped_refunds"
cassette = "cassettes/live/transfer_swapped_refunds.jsonl"
checks = [
  { type = "rule", ref = "examples.retail_agent.rules:matches_ground_truth", args = { task = "transfer_swapped_refunds" } },
  { type = "required_tools", tools = ["transfer_to_human_agents"] },
  { type = "forbidden_tools", tools = ["cancel_pending_order", "modify_pending_order_address", "return_delivered_order_items", "exchange_delivered_order_items"] },
]
