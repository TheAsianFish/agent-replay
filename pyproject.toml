[project]
name = "agent-replay"
version = "1.0.0"
description = "Record-and-replay regression testing for LLM agents"
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "TheAsianFish" }]
keywords = ["llm", "agents", "testing", "evals", "anthropic", "replay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.14,<2",
    "anthropic>=1.12,<2",
    "jsonschema>=4.23,<5",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "rich>=13",
    "sqlalchemy>=2.1,<3",
    "structlog>=24",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/TheAsianFish/agent-replay"
Repository = "https://github.com/TheAsianFish/agent-replay"
Issues = "https://github.com/TheAsianFish/agent-replay/issues"
Changelog = "https://github.com/TheAsianFish/agent-replay/blob/main/CHANGELOG.md"

[project.scripts]
replay = "agent_replay.cli:main"

[project.optional-dependencies]
ollama = [
    "ollama>=0.6,<0.7",
]
server = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

# README.md links to repository files (RESULTS.md, docs/screenshots/*.png) by relative
# path, which PyPI cannot resolve; the published description points them at GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://|#)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/TheAsianFish/agent-replay/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/TheAsianFish/agent-replay/blob/main/\1)'

# The wheel is the package: its modules, py.typed, the Alembic revisions and template
# (agent_replay/migrations, read at runtime through "agent_replay:migrations") and, when
# `make ui` has built it, the dashboard in agent_replay/server/static. That directory is
# gitignored, which hatch honours, so it is listed as an artifact to be picked up anyway.
[tool.hatch.build.targets.wheel]
packages = ["agent_replay"]
artifacts = ["agent_replay/server/static/**"]

# The sdist holds what building the wheel needs, the dashboard build included when present,
# and none of the repository's examples, tests, eval data or dashboard sources.
[tool.hatch.build.targets.sdist]
only-include = [
    "agent_replay",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
artifacts = ["agent_replay/server/static/**"]
exclude = ["__pycache__", "*.py[cod]"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["examples/toy_agent/cassettes", "examples/retail_agent/cassettes"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "TID", "ANN", "S", "PL"]
ignore = [
    "PLR0913",  # CLI commands take one parameter per option by design
    "PLR0917",
    "PLR2004",  # magic numbers are fine in tests and pricing tables
    "S101",     # assert is how pytest works
    "ANN401",   # proxies over SDK clients are dynamically typed by nature; mypy --strict still runs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "PLR"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: calls the real Anthropic API; needs ANTHROPIC_API_KEY (run with `make test-live`)",
    "postgres: needs a disposable PostgreSQL database in REPLAY_TEST_PG_URL; skipped without it",
]
filterwarnings = ["error"]
